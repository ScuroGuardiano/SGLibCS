# Publishes MdLive/nvim from master as the root of the mdlive/nvim branch,
# so plugin managers can use it directly: branch = "mdlive/nvim".
#
# The split is deterministic, so every run is a fast-forward of mdlive/nvim.
# A push that isn't a fast-forward (someone committed to mdlive/nvim directly)
# fails instead of overwriting those commits.
name: Publish MdLive Neovim plugin branch

on:
  push:
    branches: [master]
    paths: ["MdLive/nvim/**"]
  workflow_dispatch:

permissions:
  contents: write

# Two pushes to master in a row must not race each other on the same branch
concurrency:
  group: mdlive-nvim-branch
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git subtree split walks the whole history of the directory
          fetch-depth: 0

      - name: Split and push mdlive/nvim
        run: |
          split=$(git subtree split --prefix=MdLive/nvim HEAD)
          echo "Publishing $split as mdlive/nvim"
          git push origin "$split:refs/heads/mdlive/nvim"
